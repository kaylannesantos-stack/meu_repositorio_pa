<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Tabuada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pixel-scene" aria-label="Gato preto dormindo na varanda à noite">
        <div class="stars">
            <span class="star star-1"></span>
            <span class="star star-2"></span>
            <span class="star star-3"></span>
            <span class="star star-4"></span>
            <span class="star star-5"></span>
            <span class="star star-6"></span>
        </div>

        <div class="moon"></div>

        <div class="house">
            <div class="roof"></div>
            <div class="window"></div>
            <div class="door"></div>
        </div>

        <div class="balcony"></div>

        <div class="cat" aria-hidden="true">
            <div class="ear ear-left"></div>
            <div class="ear ear-right"></div>
            <div class="head">
                <span class="eye eye-left"></span>
                <span class="eye eye-right"></span>
                <span class="nose"></span>
            </div>
            <div class="body"></div>
            <div class="paw paw-left"></div>
            <div class="paw paw-right"></div>
            <div class="tail"></div>
        </div>

    </div>

    <h1>Gerador de Tabuada</h1>
    <label for="numeroInput">Digite um número: </label>
    <input type="number" id="numero-input" placeholder="Ex.:5">
    <button id="btn-gerar">Gerador Tabuada</button>

    <div id="resultado-aqui"></div>
    <script src="script.js"></script>
</body>
</html>
